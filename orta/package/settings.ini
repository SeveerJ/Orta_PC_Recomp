; Panzer Dragoon Orta - settings. Edit with Notepad; changes apply next start.

[Display]
; Render resolution:
;   480 (the original, fastest), 720, 1080, 1440, 2160 or Native (your
;   screen's). The game is drawn at the next whole multiple of 480 lines
;   (720 -> 960, 1080 and 1440 -> 1440, 2160 -> 2400), then fitted to the screen.
Resolution = 480
; 1 = 16:9 widescreen, 0 = original 4:3.
Widescreen = 1
; 1 = fill the screen (borderless). Alt+Enter switches while playing.
Fullscreen = 1
; Window height when not fullscreen.
WindowHeight = 720
; Frame rate cap (the game is made for 60). 0 = no cap.
FrameRateCap = 60
; 1 = wait for the monitor's refresh when showing a frame (no tearing, more lag).
VSync = 0

[Audio]
; 0 to 100.
Volume = 50
; Sound effects relative to music, 0 to 100.
SfxVolume = 70
